name: Build GFDM V4-V8 (x86)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 make zip python3
      - name: Build packages and tests
        run: make -j1
      - name: Test V4 layered exporter
        run: python3 -m unittest discover -s scripts/tests
      - name: Validate all five packages
        run: python3 scripts/check-gfdm-packages.py build/zip
      - uses: actions/upload-artifact@v4
        with:
          name: gfdm-v4-to-v8-x86-${{ github.sha }}
          path: build/zip/gfdm-v*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gfdm-tests-x86-${{ github.sha }}
          path: build/bin/indep-32/*-test.exe
          if-no-files-found: error
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gfdm-tests-x86-${{ github.sha }}
          path: tests
      - name: Run all ten x86 tests
        shell: pwsh
        run: |
          $tests = @('geninput-naive', 'gfdm-profile', 'gfdm-storage', 'gfdm-coin', 'gfdm-debug', 'gfdm-effect', 'gfdm-bootstrap', 'gfdm-config', 'gfdm-layered', 'gfdm-avs-config')
          foreach ($test in $tests) {
            & "./tests/$test-test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
