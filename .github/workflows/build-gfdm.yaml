name: "Build GFDM V4-V8 support"

on:
  push:
    branches:
      - gfdm
  workflow_dispatch:

jobs:
  build-gfdm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y runc containerd docker.io
          sudo systemctl enable --now docker
          sudo docker info

      - name: Build bemanitools
        run: make build-docker

      - name: Extract GFDM V4-V8 packages
        run: |
          mkdir -p artifact
          cp build/zip/gfdm-v[4-8].zip artifact/
          python3 scripts/check-gfdm-packages.py artifact

      - name: Build input, GFDM profile and storage tests for both architectures
        run: |
          docker run --rm --entrypoint /bin/sh --volume "$PWD:/bemanitools" bemanitools-build:latest -c 'make build/bin/indep-32/geninput-naive-test.exe build/bin/indep-64/geninput-naive-test.exe build/bin/indep-32/gfdm-profile-test.exe build/bin/indep-64/gfdm-profile-test.exe build/bin/indep-32/gfdm-storage-test.exe build/bin/indep-64/gfdm-storage-test.exe'
          mkdir -p naive-tests
          cp build/bin/indep-32/geninput-naive-test.exe naive-tests/geninput-naive-test-32.exe
          cp build/bin/indep-64/geninput-naive-test.exe naive-tests/geninput-naive-test-64.exe

          cp build/bin/indep-32/gfdm-profile-test.exe naive-tests/gfdm-profile-test-32.exe
          cp build/bin/indep-64/gfdm-profile-test.exe naive-tests/gfdm-profile-test-64.exe
          cp build/bin/indep-32/gfdm-storage-test.exe naive-tests/gfdm-storage-test-32.exe
          cp build/bin/indep-64/gfdm-storage-test.exe naive-tests/gfdm-storage-test-64.exe

      - name: Upload Naive keyboard tests
        uses: actions/upload-artifact@v4
        with:
          name: naive-tests-${{ github.sha }}
          path: naive-tests/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload GFDM V4-V8 packages
        uses: actions/upload-artifact@v4
        with:
          name: gfdm-v4-to-v8-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifact/gfdm-v*.zip

  test-naive:
    needs: build-gfdm
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: naive-tests-${{ github.sha }}
      - name: Run input, GFDM profile and storage tests (32-bit and 64-bit)
        shell: pwsh
        run: |
          ./geninput-naive-test-32.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./geninput-naive-test-64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gfdm-profile-test-32.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gfdm-profile-test-64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gfdm-storage-test-32.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gfdm-storage-test-64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
