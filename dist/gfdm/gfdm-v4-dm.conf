# DrumMania V4 (G32)

# V4 e-amusement endpoint. Use the host/port where Asphyxia CORE listens.
eamuse.server=localhost:80

# If the game cannot start with multiple network adapters (including VPNs),
# set this to the IPv4 address of the adapter used to reach your server.
# Only that adapter is exposed to the game. Leave empty to use the default route.
adapter.override_ip=

# Roundplug IDs. The defaults are valid BT5 test IDs.
eamuse.pcbid=0101020304050607086F
eamuse.eamid=0101020304050607086F

# DrumMania V4 uses G32; keep this code matched to the game image.
security.mcode=GCG32JAA

# Optional built-in keyboard fallback, disabled when using configured IO.
# Enable only for keyboard troubleshooting.
input.keyboard=false

# Keep the OpenGL frame rate at 60 for normal game speed.
gfx.frame_rate_limit=60.0
gfx.forced_refresh_rate=60

# gfx.fullscreen: 0 window, 1 fullscreen 4:3 (default), 2 fullscreen stretch.
# Restart the game after changing the display mode.
gfx.fullscreen=1

# Optional verified shared unpacked data; keep false for original PAK files.
# Shared-store installs require true. Restart after changing this option.
layered.enabled=false
# Rehash all objects at startup instead of reusing valid NTFS verification.
layered.full_verify=false
