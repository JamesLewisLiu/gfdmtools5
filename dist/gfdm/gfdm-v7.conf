# V7 e-amusement endpoint. Use the host/port where Asphyxia CORE listens.
eamuse.server=localhost:80

# Optional IPv7 address to expose as the only network adapter to the game.
# Leave empty to select the adapter used by the default route.
adapter.override_ip=

# Roundplug IDs. The defaults are valid BT5 test IDs.
eamuse.pcbid=0101020304050607086F
eamuse.eamid=0101020304050607086F

# Generic V7 configuration (DM uses J32; GF uses J33). The launch scripts use
# the mode-specific files below so each game receives its own roundplug code.
security.mcode=GCJ32JBA

# Enable the default keyboard mapping (F1 service, F2 test, Z/X/C GF,
# A/S/D/F/G DM, Enter start, 5 coin).
input.keyboard=true
