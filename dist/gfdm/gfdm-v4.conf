# V4 e-amusement endpoint. Use the host/port where Asphyxia CORE listens.
eamuse.server=localhost:80

# Roundplug IDs. The defaults are valid BT5 test IDs.
eamuse.pcbid=0101020304050607086F
eamuse.eamid=0101020304050607086F

# Generic V4 configuration (GF uses G32; DM uses G33). The launch scripts use
# the mode-specific files below so each game receives its own roundplug code.
security.mcode=GCG32JAA

# Enable the default keyboard mapping (F1 service, F2 test, Z/X/C GF,
# A/S/D/F/G DM, Enter start, 5 coin).
input.keyboard=true
