# V6 e-amusement endpoint. Use the host/port where Asphyxia CORE listens.
eamuse.server=localhost:80

# Optional IPv6 address to expose as the only network adapter to the game.
# Leave empty to select the adapter used by the default route.
adapter.override_ip=

# Roundplug IDs. The defaults are valid BT5 test IDs.
eamuse.pcbid=0101020304050607086F
eamuse.eamid=0101020304050607086F

# Generic V6 configuration (DM uses I32; GF uses I33). The launch scripts use
# the mode-specific files below so each game receives its own roundplug code.
security.mcode=GCI32JAA

# Optional built-in keyboard fallback, disabled when using configured IO.
# Enable only for keyboard troubleshooting.
input.keyboard=false
