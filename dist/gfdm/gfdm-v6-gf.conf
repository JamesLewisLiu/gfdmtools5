# Guitar Freaks V6 (I33)

# V6 e-amusement endpoint. Use the host/port where Asphyxia CORE listens.
eamuse.server=localhost:80

# Optional IPv4 address to expose as the only network adapter to the game.
# Leave empty to select the adapter used by the default route.
adapter.override_ip=

# Roundplug IDs. The defaults are valid BT5 test IDs.
eamuse.pcbid=0101020304050607086F
eamuse.eamid=0101020304050607086F

# Guitar Freaks V6 uses I33; keep this code matched to the game image.
security.mcode=GCI33JAA

# Optional built-in keyboard fallback, disabled when using configured IO.
# Enable only for keyboard troubleshooting.
input.keyboard=false

# Keep the OpenGL frame rate at 60 for normal game speed.
gfx.frame_rate_limit=60.0
gfx.forced_refresh_rate=60

# gfx.fullscreen: 0 window, 1 fullscreen 4:3, 2 fullscreen stretch,
# 3 borderless 4:3, 4 borderless stretch; restart required.
gfx.fullscreen=0
